version: 2.1

orbs:
  python: circleci/python@3.0.0
  codecov: codecov/codecov@6.0.0

executors:
  my-executor:
    docker:
      - image: cimg/python:3.12

jobs:
  run_tests:
    executor: my-executor
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Install project
          command: |
            uv sync --locked --group test
      - run:
          name: Run tests and generate coverage report
          command: uv run pytest --cov-report=xml --cov-config=.coveragerc --cov=sigmaepsilon.math
      - store_artifacts:
          name: Store coverage report as artifact
          path: coverage.xml
      - codecov/upload:
          token: CODECOV_TOKEN
      - store_test_results:
          name: Store test results
          path: test-results

  deploy_to_test_pypi:
    executor: my-executor
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Build project
          command: |
            uv build
      - run:
          name: Deploy to TestPyPI
          command: |
            uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ --token $TEST_PYPI_TOKEN

  deploy_to_pypi:
    executor: my-executor
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Build project
          command: |
            uv build
      - run:
          name: Deploy to PyPI
          command: |
            uv publish --check-url https://pypi.org/simple/ --token $PYPI_TOKEN

workflows:
  test_and_deploy:
    jobs:
      - run_tests

      - deploy_to_test_pypi:
          context:
            - TestPyPI deploy
          requires:
            - run_tests
          filters:
            branches:
              only:
                - test

      - deploy_to_pypi:
          context:
            - PyPI deploy
          requires:
            - run_tests
          filters:
            branches:
              only:
                - main
