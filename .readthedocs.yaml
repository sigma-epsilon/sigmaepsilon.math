# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # Install uv
      - pip install uv
    post_install:
      # Install the package with the 'docs' dependency group
      - uv pip install --python $READTHEDOCS_VIRTUALENV_PATH/bin/python -e . --group docs

sphinx:
  configuration: docs/source/conf.py
