repos:
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.8.8
      hooks:
          - id: uv-lock

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.5.0
      hooks:
          - id: check-yaml
          - id: end-of-file-fixer
          - id: trailing-whitespace

    - repo: https://github.com/psf/black
      rev: 24.2.0
      hooks:
          - id: black
            args: ["src/"]
