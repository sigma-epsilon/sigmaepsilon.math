[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigmaepsilon.math"
version = "2.6.0"
description = "A Python Library for Applied Mathematics in Physical Sciences."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bence Balogh", email = "bencebalogh@sigmaepsilon.com" }]
maintainers = [{ name = "Bence Balogh", email = "bencebalogh@sigmaepsilon.com" }]
classifiers = [  # https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
keywords = [
    "engineering", "mathematics", "optimization", "vector", "tensor",
    "vector algebra", "tensor algebra", "symbolic mathematics",
    "nonlinear optimization"
]
dependencies = [
    "sigmaepsilon-core>=1.2.1",
    "sigmaepsilon-deepdict>=3.0.0",
    "numba>=0.56.2",
    "numpy>=1.23",
    "scipy>=1.9",
    "awkward>=2.0.0",
    "sympy>=1.9",
    "pydantic>=2.0",
    # packages pinned for vulnerability reasons
    "zipp>=3.19.1",
]

[project.urls]
Homepage = "https://github.com/sigma-epsilon/sigmaepsilon.math"
Repository = "https://github.com/sigma-epsilon/sigmaepsilon.math"
Documentation = "https://sigmaepsilonmath.readthedocs.io/en/latest/?badge=latest"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmaepsilon"]

[tool.hatch.build.targets.sdist]
include = ["src/sigmaepsilon", "README.md", "LICENSE"]

[tool.uv]
# Poetry groups were opt-in; keep it that way (`uv sync --group <name>`).
default-groups = []

[dependency-groups]
dev = [
    "ipykernel>=6.29.2,<7",
    "black>=24.2.0,<25",
    "ipython>=8.21.0,<9",
    "pre-commit>=3.6.1,<4",
    "matplotlib>=3.9.2,<4",
]
test = [
    "pytest>=8.0.1,<9",
    "pytest-cov>=4.1.0,<5",
    "networkx>=3.2.1,<4",
    "flake8>=7.0.0,<8",
    "coverage>=7.4.1,<8",
    "pandas>=2.2.3,<3",
    "matplotlib>=3.9.2,<4",
]
docs = [
    "ipython>=8.21.0,<9",
    "myst-parser>=2.0.0,<3",
    "sphinx-gallery>=0.15.0,<0.16",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinxcontrib-bibtex>=2.6.2,<3",
    "nbsphinx-link>=1.3.0,<2",
    "sphinxcontrib-svg2pdfconverter>=1.2.2,<2",
    "sphinx-design>=0.5.0,<0.6",
    "sphinx-inline-tabs>=2023.4.21,<2024",
    "pydata-sphinx-theme>=0.15.2,<0.16",
    "networkx>=3.2.1,<4",
    "plotly>=5.19.0,<6",
    "matplotlib>=3.9.2,<4",
    "myst-nb>=1.4.0,<2",
]
